[project]
name = "hm-worker"
version = "0.1.0"
description = "H~M agent run worker — polls agent_runs and executes Tradi"
requires-python = ">=3.11,<3.14"
dependencies = [
    "supabase>=2.10",
    "python-dotenv>=1.0",
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
]

[project.scripts]
hm-worker = "hm_worker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
