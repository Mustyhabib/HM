name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend: lint → build (tsc + vite) → unit tests ──────────────────────
  frontend:
    name: Frontend (lint · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tradi/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Tradi/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build
        env:
          # Supabase vars must be present for Vite to compile without errors.
          # Use placeholder values — the build only needs them to be non-empty.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key

      - name: Unit tests (vitest)
        run: npm run test:run

  # ── Worker: hermetic pytest (no network, no Supabase) ─────────────────────
  worker:
    name: Worker (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe-trading-saas/worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vibe-trading-saas/worker/pyproject.toml

      - name: Create venv and install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]" --quiet

      - name: Run hermetic tests
        # env -u flags required: the GitHub runner does not leak PYTHONPATH/
        # VIRTUAL_ENV, but we mirror the local machine's safeguard to keep the
        # test command identical to what devs run.
        run: env -u PYTHONPATH -u VIRTUAL_ENV .venv/bin/python -m pytest -q
